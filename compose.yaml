services:
  api:
    restart: unless-stopped
    build: ./backend
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SCRAPER_URL: http://scraper:4100
    ports: ["8000:8000"]
    depends_on: [db, redis, scraper]
    command: php artisan serve --host=0.0.0.0 --port=8000
  queue:
    restart: unless-stopped
    build: ./backend
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SCRAPER_URL: http://scraper:4100
    depends_on: [db, redis, scraper]
    command: php artisan queue:work redis --tries=3 --backoff=30
  scheduler:
    restart: unless-stopped
    build: ./backend
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SCRAPER_URL: http://scraper:4100
    depends_on: [db, redis, scraper]
    command: php artisan schedule:work
  web:
    restart: unless-stopped
    build: ./frontend
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
  scraper:
    restart: unless-stopped
    build: ./scraper
    environment:
      PORT: 4100
      SCRAPER_TOKEN: ${SCRAPER_TOKEN}
    expose: ["4100"]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass '$$REDIS_PASSWORD'"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes: [redis-data:/data]
volumes:
  postgres-data:
  redis-data:
